<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';"
    />
    <title>Sterowanie slajdami</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f4f6;
        --panel: #ffffff;
        --border: #d1d5db;
        --text: #111827;
        --btn: #e5e7eb;
        --btn-hover: #d1d5db;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: "Segoe UI", "Segoe UI Variable", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        height: 100%;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .controls {
        flex: 1;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        padding: 8px;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }

      button {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--btn);
        cursor: pointer;
        font-weight: 700;
        font-size: 22px;
        transition: background-color 120ms ease;
      }

      button:hover {
        background: var(--btn-hover);
      }

      button:active {
        transform: translateY(1px);
      }

      .present-toggle {
        height: 44px;
        font-size: 15px;
        color: white;
        background: #4caf50;
        border-color: #4caf50;
      }

      .present-toggle:hover {
        background: #43a047;
      }

      .present-toggle.is-stop {
        background: #ef4444;
        border-color: #ef4444;
      }

      .present-toggle.is-stop:hover {
        background: #dc2626;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="controls">
        <button type="button" data-action="prev-song" title="Poprzednia piesn">
          &laquo;
        </button>
        <button
          type="button"
          data-action="prev-verse"
          title="Poprzednia zwrotka"
        >
          &lsaquo;
        </button>
        <button type="button" data-action="next-verse" title="Nastepna zwrotka">
          &rsaquo;
        </button>
        <button type="button" data-action="next-song" title="Nastepna piesn">
          &raquo;
        </button>
      </div>
      <button
        id="present-toggle"
        class="present-toggle"
        type="button"
        data-action="toggle-present"
      >
        Prezentuj
      </button>
    </div>
    <script>
      const presentToggleButton = document.getElementById("present-toggle");
      let isPresenting = false;

      const sendAction = (action) => {
        window.api.sendSlideControlAction?.(action);
      };

      const renderPresentToggle = () => {
        presentToggleButton.textContent = isPresenting ? "Zakoncz" : "Prezentuj";
        presentToggleButton.classList.toggle("is-stop", isPresenting);
      };

      document.querySelectorAll("button[data-action]").forEach((button) => {
        button.addEventListener("click", () => {
          sendAction(button.dataset.action);
        });
      });

      window.api.onSlideControlPresenting?.((presenting) => {
        isPresenting = presenting;
        renderPresentToggle();
      });

      renderPresentToggle();
    </script>
  </body>
</html>
